name: pansharpen_dl
channels:
  - pytorch
  - conda-forge
dependencies:
  # Lean GPU runtime for the bundled Z-PNN code. torchvision, torchaudio,
  # and scikit-learn are intentionally omitted because neither ArqPy nor
  # the upstream Z-PNN inference/fine-tuning scripts import them.
  - python=3.10
  - scikit-image
  - scipy
  - cudatoolkit=11.3
  - matplotlib
  - numpy
  - pytorch
  - tqdm
  - gdal
  - tk
  - pysimplegui
