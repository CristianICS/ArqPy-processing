# mamba env create -f requirements.yml
name: arq_proc
channels:
  - conda-forge
channel_priority: strict
dependencies:
# broadly supported across geospatial libs
# avoids many of the ABI tangles that can slow solving
  - python=3.11
  - gdal>=3.8,<3.10
  - rasterio>=1.3,<1.4
  - numpy
  - pandas
  - geopandas
  - matplotlib
  - numexpr
  - py6s
  - earthengine-api